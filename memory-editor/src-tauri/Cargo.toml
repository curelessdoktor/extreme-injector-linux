[package]
name = "memory-editor"
version = "0.1.0"
description = "Cross-platform memory editor/scanner (Cheat Engine-like)"
authors = ["you"]
edition = "2021"

[lib]
name = "memory_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux: process listing and memory maps
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.16"
procfs-core = "0.16"
nix = { version = "0.29", features = ["ptrace", "uio", "signal"] }

# Windows: process and memory APIs (stub types; implement with windows-sys if building on Windows)
[target.'cfg(target_os = "windows")'.dependencies]
# windows-sys = { version = "0.59", features = ["Win32_System_ProcessSnapshot", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_Foundation", "Win32_System_Threading"] }
